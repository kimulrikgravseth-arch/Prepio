<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn – Prepio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_Y2hvaWNlLXN0YXJsaW5nLTkuY2xlcmsuYWNjb3VudHMuZGV2JA"
    src="https://pk_test_Y2hvaWNlLXN0YXJsaW5nLTkuY2xlcmsuYWNjb3VudHMuZGV2JA.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript"
  ></script>
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      background: var(--bg);
    }
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary, #ff6b1a);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 16px;
    }
    .login-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 8px;
    }
    .login-subtitle {
      font-size: 16px;
      color: var(--text-muted, #666);
      margin: 0;
    }
    #clerk-sign-in {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: center;
    }
    .login-back {
      margin-top: 32px;
      color: var(--text-muted, #666);
      text-decoration: none;
      font-size: 14px;
    }
    .login-back:hover { color: var(--primary, #ff6b1a); }

    /* Skjul Clerk-branding (alle varianter) */
    [data-clerk-component] + div,
    .cl-powered-by,
    .cl-internal-b3fm6y,
    .cl-internal-1jb6vqx,
    .cl-footer,
    .cl-footerActionLink ~ .cl-internal-b3fm6y,
    [data-clerk-component] ~ div,
    div[class*="powered"],
    div[class*="cl-powered"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* Skjul Clerk sin duplikat-header (vi har vår egen over) */
    .cl-headerTitle,
    .cl-headerSubtitle,
    .cl-header {
      display: none !important;
    }
  </style>
</head>
<body>

  <main class="login-page">
    <div class="login-header">
      <a href="/" class="login-logo">Prepio</a>
      <h1 class="login-title">Logg inn på Prepio</h1>
      <p class="login-subtitle">For å fortsette, logg inn eller lag en konto</p>
    </div>

    <div id="clerk-sign-in"></div>

    <a href="/" class="login-back">← Tilbake til forsiden</a>
  </main>

  <script>
    window.addEventListener('load', async () => {
      try {
        await window.Clerk.load({
          localization: {
            signIn: {
              start: {
                title: 'Logg inn på Prepio',
                subtitle: 'For å fortsette, logg inn eller lag en konto',
                actionText: 'Har ikke konto?',
                actionLink: 'Registrer deg',
                actionButton: 'Fortsett'
              }
            },
            formButtonPrimary: 'Fortsett',
            userButton: {
              action__signOut: 'Logg ut'
            }
          }
        });
        window._clerk = window.Clerk;

        // Les ?redirect= fra URL — send brukeren tilbake dit etter innlogging
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/interview';

        // Allerede innlogget? Send rett videre
        if (window.Clerk.user) {
          window.location.href = redirect;
          return;
        }

        // Monter sign-in komponenten (ikke modal)
        window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
          afterSignInUrl: redirect,
          afterSignUpUrl: redirect,
          appearance: {
            elements: {
              card: { borderRadius: '16px', boxShadow: '0 10px 40px rgba(0,0,0,0.08)' }
            }
          }
        });
      } catch (err) {
        console.error('Clerk feil:', err);
      }
    });
  </script>
</body>
</html>
